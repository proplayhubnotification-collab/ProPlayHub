<!-- MOBILE APP – LIVE CHAT SUPPORT PAGE (Google Pixel 7 Optimized) -->
<style>
    :root {
        --primary: #ec003f;
        --light-bg: #f8fafc;
        --light-text: #020618;
        --dark-bg: #020618;
        --dark-text: #f8fafc;
        --radius: 0.375rem;
        --card-light: #ffffff;
        --card-dark: #1a1a1a;
    }

    body {
        margin: 0;
        background: var(--light-bg);
        color: var(--light-text);
        font-family: "Inter", sans-serif;
    }
    body.dark-mode { background: var(--dark-bg); color: var(--dark-text); }

    .mobile-app {
        max-width: 430px;
        margin: auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--light-bg);
        padding-bottom: 80px;
    }
    body.dark-mode .mobile-app { background: var(--dark-bg); }

    /* TOP BAR */
    .topbar {
        padding: 18px 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        position: sticky;
        top: 0;
        background: var(--light-bg);
        z-index: 20;
    }
    body.dark-mode .topbar { background: var(--dark-bg); }

    .back-btn {
        font-size: 20px;
        cursor: pointer;
    }
    .support-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--primary);
    }

    /* CHAT AREA */
    .chat-container {
        flex: 1;
        padding: 15px 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        overflow-y: auto;
    }

    .msg {
        max-width: 75%;
        padding: 12px 14px;
        border-radius: var(--radius);
        font-size: 14px;
        line-height: 1.4;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .msg.user {
        align-self: flex-end;
        background: var(--primary);
        color: white;
        border-bottom-right-radius: 0;
    }

    .msg.support {
        align-self: flex-start;
        background: var(--card-light);
        border-bottom-left-radius: 0;
    }
    body.dark-mode .msg.support {
        background: var(--card-dark);
    }

    .time {
        font-size: 11px;
        opacity: 0.6;
        margin-top: 4px;
    }

    /* INPUT BAR */
    .input-bar {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        max-width: 430px;
        width: 100%;
        background: var(--card-light);
        display: flex;
        align-items: center;
        padding: 12px 15px;
        gap: 10px;
        border-top: 1px solid #ddd;
    }
    body.dark-mode .input-bar {
        background: var(--card-dark);
        border-color: #333;
    }

    .chat-input {
        flex: 1;
        padding: 12px;
        border-radius: var(--radius);
        border: 1px solid #ccc;
        font-size: 14px;
    }

    .send-btn {
        background: var(--primary);
        color: white;
        padding: 10px 14px;
        border-radius: var(--radius);
        border: none;
        font-weight: 600;
        cursor: pointer;
    }

    /* LOADING DOTS */
    .typing {
        background: var(--card-light);
        padding: 10px 14px;
        border-radius: var(--radius);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    body.dark-mode .typing { background: var(--card-dark); }

    .dot {
        width: 6px;
        height: 6px;
        background: #bbb;
        border-radius: 50%;
        animation: blink 1.4s infinite both;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
        0% { opacity: .2; }
        20% { opacity: 1; }
        100% { opacity: .2; }
    }
</style>

<div class="mobile-app">

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="back-btn">←</div>
        <div class="support-title">Live Support</div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-container">

        <div class="msg support">
            Hello! 👋 How can I assist you today?
            <div class="time">09:41 AM</div>
        </div>

        <div class="msg user">
            Hi! I need help with my subscription.
            <div class="time">09:42 AM</div>
        </div>

        <div class="msg support">
            Of course! Can you tell me what issue you're experiencing?
            <div class="time">09:42 AM</div>
        </div>

        <!-- Typing indicator -->
        <div class="typing">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

    </div>

</div>

<!-- INPUT BAR -->
<div class="input-bar">
    <input class="chat-input" placeholder="Type a message...">
    <button class="send-btn">Send</button>
</div>
