<!-- 
  PROPLAY HUB MOBILE FINAL
  - Optimized for mobile (Mobile-first).
  - Auto Dark Mode based on system settings (no toggle button).
  - Integrated Dashboard & Live Chat.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>ProPlay Hub Mobile</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

    <script>
        // Tailwind Config: Use 'media' to respect system preferences automatically
        tailwind.config = {
            darkMode: 'media', 
            theme: {
                extend: {
                    colors: {
                        'primary': '#ec003f', // Brand Color: Red/Pink
                        'dark-bg': '#020618',
                        'light-bg': '#f8fafc',
                        'card-dark': '#0c1221', 
                    },
                    borderRadius: {
                        'lg': '0.375rem',
                    }
                }
            }
        }
    </script>
    <style>
        /* Toast Animation */
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .toast-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .toast-slide-out { animation: slideOut 0.3s ease-in forwards; }
        
        /* Main container simulating mobile screen */
        main {
            padding-bottom: 20px; 
            max-width: 420px; 
            margin-left: auto;
            margin-right: auto;
        }

        /* Hide scrollbar for customer list */
        #customer-list-container {
            max-height: none; 
            overflow-y: hidden;
        }

        /* Chat window styling */
        #chat-window {
            height: calc(100vh - 180px); /* Auto-fill remaining space */
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Hide CSAT column on very small screens */
        .mobile-hidden-md {
            display: none !important;
        }
        
        /* Smooth color transitions */
        body, div, p, span, h1, h2, h3, button, input, select {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>

<body class="bg-light-bg text-gray-900 dark:bg-dark-bg dark:text-slate-100 min-h-screen">
    
    <main class="min-h-screen p-4 flex flex-col relative">
        <!-- Toast Alert Container -->
        <div id="toast-container" class="fixed top-4 right-4 text-sm z-50 pointer-events-none"></div>

        <!-- HEADER (No Dark Mode Toggle) -->
        <header class="flex justify-between items-center mb-4 pb-3 border-b border-primary/20 shrink-0">
            <div class="flex flex-col">
                <h1 class="text-2xl font-extrabold text-primary">ProPlay Hub</h1>
                <p id="header-subtitle" class="text-xs text-slate-500 dark:text-slate-400">Management Dashboard</p>
            </div>
            <div class="flex items-center space-x-3">
                <!-- View Toggle Button (Chat <-> Dashboard) -->
                <button id="nav-toggle" class="p-2 rounded-lg relative hover:bg-primary/10 transition duration-300 border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300" title="Toggle Chat/Dashboard">
                    <i id="nav-icon" class="fas fa-comments text-lg text-primary"></i>
                </button>
                
                <!-- Notification Button (US22) -->
                <button id="offer-btn" class="p-2 rounded-lg relative hover:bg-primary/10 transition duration-300" title="Offers (US22)">
                    <i class="fas fa-bell text-lg text-slate-600 dark:text-slate-300"></i>
                    <span id="notification-badge" class="absolute top-1 right-1 h-2.5 w-2.5 rounded-full bg-primary border-2 border-light-bg dark:border-dark-bg transition-opacity duration-300"></span>
                </button>
            </div>
        </header>

        <!-- User ID Display -->
        <div class="text-[10px] mb-2 text-center text-slate-400 dark:text-slate-500 shrink-0">
            ID: <span id="user-id-display" class="font-mono font-bold text-primary">Loading...</span>
        </div>

        <!-- 1. DASHBOARD VIEW (US24, US26) -->
        <div id="dashboard-view" class="space-y-4 flex-grow">
            
            <!-- KPIs (US24) -->
            <section class="space-y-3">
                <h2 class="text-lg font-semibold border-l-4 border-primary pl-2">Overview (US24)</h2>
                
                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-white dark:bg-card-dark p-3 rounded-lg shadow-sm border border-slate-100 dark:border-slate-800">
                        <p class="text-xs font-medium text-slate-500 dark:text-slate-400">Customers</p>
                        <p class="text-xl font-bold text-primary mt-0.5">1,560</p>
                        <p class="text-[10px] text-green-500">+5.2%</p>
                    </div>
                    <div class="bg-white dark:bg-card-dark p-3 rounded-lg shadow-sm border border-slate-100 dark:border-slate-800">
                        <p class="text-xs font-medium text-slate-500 dark:text-slate-400">Revenue</p>
                        <p class="text-xl font-bold text-primary mt-0.5">$120K</p>
                        <p class="text-[10px] text-primary">+10%</p>
                    </div>
                    <!-- Clickable KPI for Share (US23) -->
                    <div class="bg-white dark:bg-card-dark p-3 rounded-lg shadow-sm border border-slate-100 dark:border-slate-800 cursor-pointer active:scale-95 transition-transform" title="Share Achievement">
                        <p class="text-xs font-medium text-slate-500 dark:text-slate-400">CSAT (Share)</p>
                        <p class="text-xl font-bold text-gray-900 dark:text-slate-100 mt-0.5">4.7/5</p>
                        <p class="text-[10px] text-green-500">Excellent</p>
                    </div>
                    <!-- Doughnut Chart Container -->
                    <div class="bg-white dark:bg-card-dark p-2 rounded-lg shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col items-center justify-center">
                        <p class="text-[10px] text-slate-500 dark:text-slate-400 w-full text-left mb-1">ProPlayer Ratio</p>
                        <div class="h-16 w-full relative flex justify-center">
                            <canvas id="planPenetrationChart"></canvas>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Customer List (US26) -->
            <section class="bg-white dark:bg-card-dark p-3 rounded-lg shadow-sm border border-slate-100 dark:border-slate-800">
                <h2 class="text-lg font-semibold mb-3 border-l-4 border-primary pl-2">Customers (US26)</h2>

                <!-- Filters -->
                <div class="flex flex-col gap-2 mb-3">
                    <input type="text" id="customer-search" placeholder="Search name or ID..." class="w-full p-2 text-xs rounded-md border border-slate-300 dark:border-slate-700 bg-gray-50 dark:bg-gray-900 focus:ring-1 focus:ring-primary focus:border-primary outline-none text-gray-900 dark:text-slate-100">
                    <div class="flex gap-2">
                         <select id="customer-filter-subscription" class="w-1/2 p-2 text-xs rounded-md border border-slate-300 dark:border-slate-700 bg-gray-50 dark:bg-gray-900 focus:ring-1 focus:ring-primary text-gray-900 dark:text-slate-100">
                            <option value="all">All Plans</option>
                            <option value="ProPlayer">ProPlayer</option>
                            <option value="Basic">Basic</option>
                        </select>
                        <select id="customer-filter-status" class="w-1/2 p-2 text-xs rounded-md border border-slate-300 dark:border-slate-700 bg-gray-50 dark:bg-gray-900 focus:ring-1 focus:ring-primary text-gray-900 dark:text-slate-100">
                            <option value="all">All Status</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                </div>

                <!-- Table -->
                <div id="customer-list-container" class="overflow-x-auto">
                    <table class="min-w-full">
                        <thead class="bg-gray-50 dark:bg-gray-800/50 text-xs text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                                <th class="px-2 py-2 text-left font-medium">Name/Plan</th>
                                <th class="px-2 py-2 text-left font-medium">Status</th>
                                <th class="px-2 py-2 text-right font-medium">Support</th>
                            </tr>
                        </thead>
                        <tbody id="customer-list" class="text-xs divide-y divide-slate-100 dark:divide-slate-800">
                            <!-- JS will render here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- 2. LIVE CHAT VIEW (US25) - Hidden by default -->
        <div id="chat-view" class="hidden flex-col h-full flex-grow">
            <h2 class="text-lg font-semibold border-l-4 border-primary pl-2 mb-2 shrink-0">Live Support (US25)</h2>
            
            <div class="bg-white dark:bg-card-dark rounded-lg shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col flex-grow overflow-hidden">
                <!-- Chat Messages Area -->
                <div id="chat-window" class="p-3 space-y-3 bg-gray-50 dark:bg-gray-900/50">
                    <div class="text-center text-xs text-slate-400 mt-4">
                        <i class="fas fa-spinner fa-spin mr-1"></i> Loading messages...
                    </div>
                </div>

                <!-- Input Area -->
                <div class="p-2 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-card-dark shrink-0">
                    <div class="flex items-center space-x-2">
                        <input type="text" id="chat-input" placeholder="Enter message..." class="flex-grow p-2.5 rounded-full border border-slate-300 dark:border-slate-700 bg-gray-50 dark:bg-gray-900 text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none text-gray-900 dark:text-slate-100">
                        <button id="send-chat-btn" class="h-10 w-10 rounded-full bg-primary text-white flex items-center justify-center hover:bg-primary/90 active:scale-95 transition">
                            <i class="fas fa-paper-plane text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Share Modal (US23) -->
        <div id="share-modal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white dark:bg-card-dark rounded-xl shadow-2xl w-full max-w-xs p-5 border border-slate-200 dark:border-slate-700 transform transition-all scale-100">
                <div class="text-center mb-4">
                    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-primary/10 mb-3">
                        <i class="fas fa-trophy text-primary text-xl"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 dark:text-white">Share Achievement</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">You achieved "Legendary" rank!</p>
                </div>
                <div class="space-y-2">
                    <button class="w-full py-2.5 rounded-lg bg-black text-white text-sm font-medium flex items-center justify-center gap-2 hover:opacity-90">
                        <i class="fab fa-x-twitter"></i> Post to X
                    </button>
                    <button class="w-full py-2.5 rounded-lg bg-[#5865F2] text-white text-sm font-medium flex items-center justify-center gap-2 hover:opacity-90">
                        <i class="fab fa-discord"></i> Send to Discord
                    </button>
                    <button id="close-share-modal" class="w-full py-2.5 mt-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-600">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Vars
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        const CHAT_COLLECTION = `/artifacts/${appId}/public/data/live_chat_support`;

        let app, db, auth, currentUserId;
        let isChatView = false;
        let chartInstance = null;

        // Mock Data
        const mockCustomers = [
            { id: 'u1', name: 'Nguyen Van A', subscription: 'ProPlayer', status: 'Active', csat: 4.8 },
            { id: 'u2', name: 'Tran B', subscription: 'Basic', status: 'Active', csat: 3.5 },
            { id: 'u3', name: 'Le C', subscription: 'ProPlayer', status: 'Inactive', csat: 5.0 },
            { id: 'u4', name: 'Pham D', subscription: 'Basic', status: 'Active', csat: 4.2 },
        ];

        // --- Helpers ---
        function showToast(msg, type='info') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const bg = type === 'success' ? 'bg-green-600' : 'bg-slate-800 dark:bg-slate-700';
            el.className = `${bg} text-white px-4 py-2 rounded-full shadow-lg mb-2 text-xs font-medium toast-slide-in pointer-events-auto`;
            el.innerHTML = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.classList.replace('toast-slide-in', 'toast-slide-out');
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        function getBadgeClass(type) {
            const base = "px-1.5 py-0.5 rounded text-[10px] font-bold ";
            if(type === 'Active') return base + "bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-400";
            if(type === 'Inactive') return base + "bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-400";
            if(type === 'ProPlayer') return base + "bg-primary/10 text-primary dark:bg-primary/20 dark:text-primary";
            return base + "bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300";
        }

        function renderCustomers(list) {
            const tbody = document.getElementById('customer-list');
            if(!list.length) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-slate-400">Not found.</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(c => `
                <tr class="hover:bg-gray-50 dark:hover:bg-slate-800/50 transition">
                    <td class="px-2 py-2">
                        <div class="font-medium text-gray-900 dark:text-slate-200">${c.name}</div>
                        <span class="${getBadgeClass(c.subscription)} inline-block mt-0.5">${c.subscription}</span>
                    </td>
                    <td class="px-2 py-2"><span class="${getBadgeClass(c.status)}">${c.status === 'Active' ? 'Active' : 'Inactive'}</span></td>
                    <td class="px-2 py-2 text-right">
                        <button data-id="${c.id}" class="chat-trigger text-primary bg-primary/5 hover:bg-primary/10 dark:bg-primary/10 dark:hover:bg-primary/20 p-1.5 rounded-md transition">
                            <i class="fas fa-comment-dots"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

            document.querySelectorAll('.chat-trigger').forEach(b => {
                b.addEventListener('click', () => {
                    toggleView(true);
                    showToast(`Chatting with customer...`);
                });
            });
        }

        function toggleView(forceChat) {
            isChatView = typeof forceChat === 'boolean' ? forceChat : !isChatView;
            const dash = document.getElementById('dashboard-view');
            const chat = document.getElementById('chat-view');
            const icon = document.getElementById('nav-icon');
            const sub = document.getElementById('header-subtitle');

            if(isChatView) {
                dash.classList.add('hidden');
                chat.classList.remove('hidden');
                chat.classList.add('flex');
                icon.className = "fas fa-chart-pie text-lg text-primary";
                sub.textContent = "Live Chat (US25)";
                // Scroll to bottom of chat
                const cw = document.getElementById('chat-window');
                cw.scrollTop = cw.scrollHeight;
            } else {
                chat.classList.add('hidden');
                chat.classList.remove('flex');
                dash.classList.remove('hidden');
                icon.className = "fas fa-comments text-lg text-primary";
                sub.textContent = "Management Dashboard";
            }
        }

        // --- Chart Logic ---
        function initChart() {
            const ctx = document.getElementById('planPenetrationChart');
            if(!ctx) return;
            
            if(chartInstance) chartInstance.destroy();

            // Detect dark mode from system
            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pro', 'Others'],
                    datasets: [{
                        data: [35, 65],
                        backgroundColor: ['#ec003f', isDark ? '#1e293b' : '#e2e8f0'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: { legend: { display: false }, tooltip: { enabled: false } }
                }
            });
        }

        // --- Chat Logic ---
        function renderMsg(msg) {
            const win = document.getElementById('chat-window');
            const isMe = msg.uid === currentUserId;
            const div = document.createElement('div');
            div.className = `flex w-full mb-3 ${isMe ? 'justify-end' : 'justify-start'}`;
            
            const bubbleColor = isMe 
                ? 'bg-primary text-white rounded-tr-none' 
                : 'bg-white dark:bg-slate-800 text-gray-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-tl-none';

            div.innerHTML = `
                <div class="max-w-[80%] flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                    <div class="text-[10px] text-slate-400 mb-1 px-1">${isMe ? 'You' : 'User ' + msg.uid.slice(0,3)}</div>
                    <div class="p-2.5 rounded-2xl shadow-sm text-sm ${bubbleColor}">
                        ${msg.text}
                    </div>
                </div>
            `;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        async function setupChat() {
            if(!db) return;
            const q = query(collection(db, CHAT_COLLECTION), orderBy('timestamp', 'asc'));
            
            const win = document.getElementById('chat-window');
            win.innerHTML = ''; // Clear loading

            onSnapshot(q, (snap) => {
                snap.docChanges().forEach(change => {
                    if(change.type === 'added') renderMsg(change.doc.data());
                });
            });

            document.getElementById('send-chat-btn').addEventListener('click', sendMsg);
            document.getElementById('chat-input').addEventListener('keypress', e => {
                if(e.key === 'Enter') sendMsg();
            });
        }

        async function sendMsg() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if(!txt) return;
            
            try {
                await addDoc(collection(db, CHAT_COLLECTION), {
                    uid: currentUserId,
                    text: txt,
                    timestamp: serverTimestamp()
                });
                input.value = '';
            } catch(e) {
                showToast('Send error', 'error');
            }
        }

        // --- Init ---
        async function init() {
            // US26 Filter Logic
            const filter = () => {
                const txt = document.getElementById('customer-search').value.toLowerCase();
                const sub = document.getElementById('customer-filter-subscription').value;
                const st = document.getElementById('customer-filter-status').value;
                
                const res = mockCustomers.filter(c => 
                    (c.name.toLowerCase().includes(txt)) &&
                    (sub === 'all' || c.subscription === sub) &&
                    (st === 'all' || c.status === st)
                );
                renderCustomers(res);
            };
            
            ['customer-search', 'customer-filter-subscription', 'customer-filter-status']
                .forEach(id => document.getElementById(id).addEventListener('input', filter));

            // UI Toggles
            document.getElementById('nav-toggle').addEventListener('click', () => toggleView());
            
            // Share Modal (US23)
            const modal = document.getElementById('share-modal');
            document.querySelector('[title="Share Achievement"]').addEventListener('click', () => {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            });
            document.getElementById('close-share-modal').addEventListener('click', () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            });
            
            // Offer (US22)
            document.getElementById('offer-btn').addEventListener('click', () => {
                showToast("You have a new Offer!", "success");
                document.getElementById('notification-badge').style.opacity = '0';
            });

            // Initial Render
            renderCustomers(mockCustomers);
            initChart();

            // Firebase
            if(!firebaseConfig) {
                console.warn("No Firebase Config");
                currentUserId = 'demo-user';
                document.getElementById('user-id-display').textContent = 'Demo Mode';
                return;
            }

            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            if(initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
            else await signInAnonymously(auth);

            onAuthStateChanged(auth, u => {
                if(u) {
                    currentUserId = u.uid;
                    document.getElementById('user-id-display').textContent = u.uid.slice(0,6) + '...';
                    setupChat();
                }
            });
            
            // Listen for system theme changes to redraw chart colors
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', initChart);
        }

        init();
    </script>
</body>
</html>
