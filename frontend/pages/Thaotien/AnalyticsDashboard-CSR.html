<style>
    :root {
        --primary: #ec003f;
        --light-bg: #f8fafc;
        --light-text: #020618;
        --dark-bg: #020618;
        --dark-text: #f8fafc;
        --radius: 0.375rem;
        --card-light: #ffffff;
        --card-dark: #1a1a1a;
    }

    body {
        margin: 0;
        background: var(--light-bg);
        color: var(--light-text);
        font-family: "Inter", sans-serif;
    }

    body.dark-mode {
        background: var(--dark-bg);
        color: var(--dark-text);
    }

    /* MOBILE FRAME */
    .mobile-app {
        max-width: 430px; /* Google Pixel 7 width */
        margin: auto;
        min-height: 100vh;
        background: var(--light-bg);
        display: flex;
        flex-direction: column;
        padding-bottom: 80px; /* space for bottom nav */
    }
    body.dark-mode .mobile-app {
        background: var(--dark-bg);
    }

    /* TOP BAR */
    .topbar {
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .topbar-title {
        font-size: 22px;
        font-weight: 700;
        color: var(--primary);
    }

    .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #d1d5db;
    }

    /* KPI CARDS */
    .kpi-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 0 20px;
        margin-top: 10px;
    }

    .kpi-card {
        padding: 14px;
        background: var(--card-light);
        border-radius: var(--radius);
        box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }
    body.dark-mode .kpi-card {
        background: var(--card-dark);
    }
    .kpi-label {
        font-size: 13px;
        opacity: 0.7;
    }
    .kpi-value {
        font-size: 20px;
        font-weight: 700;
        margin-top: 5px;
    }

    /* CHART BLOCK */
    .chart { 
        margin-top: 20px;
        padding: 20px;
        border-radius: var(--radius);
        background: var(--card-light);
        box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        margin: 20px;
    }
    body.dark-mode .chart {
        background: var(--card-dark);
    }
    .chart-placeholder {
        height: 180px;
        background: #d9d9d9;
        border-radius: var(--radius);
    }

    /* FILTER */
    .filter-card {
        padding: 20px;
        background: var(--card-light);
        border-radius: var(--radius);
        margin: 20px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }
    body.dark-mode .filter-card {
        background: var(--card-dark);
    }

    select {
        width: 100%;
        padding: 12px;
        border-radius: var(--radius);
        margin-top: 10px;
    }

    .apply-btn {
        width: 100%;
        padding: 12px;
        background: var(--primary);
        color: white;
        border-radius: var(--radius);
        border: none;
        margin-top: 15px;
        font-weight: 600;
    }

    /* LOG LIST */
    .log-list {
        padding: 0 20px;
    }
    .log-item {
        padding: 15px 0;
        border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    body.dark-mode .log-item {
        border-color: rgba(255,255,255,0.1);
    }
    .log-user { font-weight: 700; }
    .log-activity { font-size: 14px; opacity: 0.8; }
    .log-time { font-size: 12px; opacity: 0.6; }

    /* BOTTOM NAV */
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 430px;
        background: var(--card-light);
        display: flex;
        justify-content: space-around;
        padding: 15px 0;
        border-top: 1px solid #ddd;
    }
    body.dark-mode .bottom-nav {
        background: var(--card-dark);
    }

    .nav-btn {
        text-align: center;
        font-size: 12px;
        opacity: 0.8;
    }
    .nav-btn.active {
        color: var(--primary);
        opacity: 1;
        font-weight: 600;
    }
</style>

<div class="mobile-app">

    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-title">Analytics</div>
        <div class="avatar"></div>
    </div>

    <!-- KPI GRID -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-label">Users</div>
            <div class="kpi-value">12,480</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Revenue</div>
            <div class="kpi-value">£18,920</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Engagement</div>
            <div class="kpi-value">32m</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Platforms</div>
            <div class="kpi-value">PC / PS / Xbox</div>
        </div>
    </div>

    <!-- Chart block -->
    <div class="chart">
        <h3 style="color:var(--primary);margin-bottom:10px;">User Growth</h3>
        <div class="chart-placeholder"></div>
    </div>

    <!-- Filters -->
    <div class="filter-card">
        <label>Date Range</label>
        <select>
            <option>Last 7 days</option>
            <option>Last 30 days</option>
            <option>Last 90 days</option>
        </select>

        <label style="margin-top:10px;">Platform</label>
        <select>
            <option>All</option>
            <option>PC</option>
            <option>PS</option>
            <option>Xbox</option>
        </select>

        <button class="apply-btn">Apply Filters</button>
    </div>

    <!-- Logs -->
    <div class="log-list">
        <div class="log-item">
            <div class="log-user">@neo</div>
            <div class="log-activity">Subscribed Pro+</div>
            <div class="log-time">10:24 AM</div>
        </div>
        <div class="log-item">
            <div class="log-user">@lilyx</div>
            <div class="log-activity">Viewed cloud services</div>
            <div class="log-time">9:58 AM</div>
        </div>
        <div class="log-item">
            <div class="log-user">@kuro</div>
            <div class="log-activity">Applied discount</div>
            <div class="log-time">9:41 AM</div>
        </div>
    </div>

</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">
    <div class="nav-btn"><i class="fa fa-home"></i><br>Home</div>
    <div class="nav-btn"><i class="fa fa-users"></i><br>Users</div>
    <div class="nav-btn active"><i class="fa fa-chart-line"></i><br>Analytics</div>
    <div class="nav-btn"><i class="fa fa-cog"></i><br>Settings</div>
</div>
