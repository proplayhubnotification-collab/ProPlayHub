<!-- Design prototype is optimized for Google Pixel 7. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Tên và mô tả ứng dụng -->
    <meta name="application-name" content="ProPlay Hub">
    <meta name="description" content="Mô tả ngắn gọn về ứng dụng của bạn">

    <!-- Màu chủ đạo khi hiển thị (thanh status, taskbar, v.v.) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020618">

    <!-- Khai báo manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Icon (cho Android, Chrome, Safari,...) -->
    <link rel="icon" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="/icons/icon-512x512.png">

    <!-- Cấu hình riêng cho iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ProPlay Hub">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Cấu hình cho Windows -->
    <meta name="msapplication-TileColor" content="#020618">
    <title>Welcome back ProPlayHub</title>
    <link rel="icon" href="../../asset/icon/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <script>
      tailwind.config = {
        darkMode: 'media', // hoặc 'class'
      }
    </script>
    <!-- Gắn javascript nếu cần thiết -->
    <!-- <script src="js/index.js"></script> -->
    <style>
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        .toast-slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }
        .toast-slide-out {
            animation: slideOut 0.3s ease-in forwards;
        }
    </style>
</head>
<body>
    <main class="w-[412px] h-[915px] mx-auto bg-slate-50 text-slate-950 dark:bg-slate-950 dark:text-slate-50 transition-colors duration-300">
    <!-- Toast Alert Container -->
        <div id="toast-container" class="fixed top-4 right-4 text-sm z-50">

        </div>

        <!-- Bắt đầu code từ chỗ này (Không sửa template này để có sự nhất quán) -->
        <!-- Trang để lựa chọn các phương thức thanh toán (ngân hàng, ví điện tử, paypal, credit card,...) -->
        <!-- Có thể thêm mã giảm giá và hiển thị giá tiền -->

    </main>
</body>
</html>
