<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Order History - ProPlay Hub</title>
    
    <!-- Meta Theme Color -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020618">

    <!-- Icons & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Configuration -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['"Be Vietnam Pro"', 'sans-serif'],
                },
                colors: {
                    brand: '#ec003f',
                    slate: {
                        50: '#f8fafc',
                        950: '#020618',
                    }
                },
                borderRadius: {
                    DEFAULT: '0.375rem',
                    'card': '1rem',
                    'input': '0.5rem'
                },
                boxShadow: {
                    'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    'glow': '0 0 15px rgba(236, 0, 63, 0.3)'
                }
            }
        }
      }
    </script>

    <style>
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .toast-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .toast-slide-out { animation: slideOut 0.3s ease-in forwards; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Status Badge Colors */
        .status-completed { @apply bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400; }
        .status-processing { @apply bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400; }
        .status-cancelled { @apply bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400; }

        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <main class="mx-auto w-full max-w-md bg-transparent pb-8 relative z-0">
        <!-- Toast Container -->
        <div id="toast-container" class="fixed top-4 right-4 z-[60] flex flex-col gap-2 pointer-events-none"></div>

        <!-- Header -->
        <header class="px-5 pt-12 pb-2 flex justify-between items-center sticky top-0 z-10 backdrop-blur-md bg-slate-50/90 dark:bg-slate-950/90 border-b border-gray-200/50 dark:border-gray-800/50">
            <button onclick="history.back()" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                <i class="fas fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-lg font-bold">Order History</h1>
            <div class="w-10"></div>
        </header>

        <!-- Filter Tabs -->
        <div class="px-4 pt-4 sticky top-[80px] z-10 bg-slate-50 dark:bg-slate-950 pb-2 overflow-x-auto hide-scrollbar">
            <div class="flex gap-2 min-w-max">
                <button onclick="filterOrders('all')" id="tab-all" class="px-4 py-2 text-xs font-bold rounded-full transition-all bg-brand text-white shadow-glow">All</button>
                <button onclick="filterOrders('processing')" id="tab-processing" class="px-4 py-2 text-xs font-bold rounded-full transition-all bg-white dark:bg-slate-800 text-gray-500 border border-gray-200 dark:border-gray-700">Processing</button>
                <button onclick="filterOrders('completed')" id="tab-completed" class="px-4 py-2 text-xs font-bold rounded-full transition-all bg-white dark:bg-slate-800 text-gray-500 border border-gray-200 dark:border-gray-700">Completed</button>
                <button onclick="filterOrders('cancelled')" id="tab-cancelled" class="px-4 py-2 text-xs font-bold rounded-full transition-all bg-white dark:bg-slate-800 text-gray-500 border border-gray-200 dark:border-gray-700">Cancelled</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="px-4 py-4 space-y-4 min-h-[50vh]" id="orders-list">
            <!-- Orders will be injected here via JS -->
        </div>

        <!-- Empty State (Hidden by default) -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="w-20 h-20 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mb-4">
                <i class="fas fa-receipt text-3xl text-gray-300 dark:text-gray-600"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800 dark:text-gray-200">No orders found</h3>
            <p class="text-sm text-gray-500 mt-1 max-w-[200px]">You haven't placed any orders in this category yet.</p>
        </div>

    </main>

    <!-- Scripts -->
    <script>
        // Sample Gaming Data
        const orders = [
            { 
                id: 'ORD-8821', 
                date: '2023-11-25', 
                total: 55.00, 
                status: 'completed', 
                icon: 'fa-gem', 
                color: 'text-blue-500', 
                bg: 'bg-blue-50 dark:bg-blue-900/20',
                items: '5000 Diamonds (Mobile Legends)'
            },
            { 
                id: 'ORD-8820', 
                date: '2023-11-24', 
                total: 120.00, 
                status: 'processing', 
                icon: 'fa-user-astronaut', 
                color: 'text-purple-500', 
                bg: 'bg-purple-50 dark:bg-purple-900/20',
                items: 'Valorant Account (Rank Immortal)'
            },
            { 
                id: 'ORD-8815', 
                date: '2023-11-20', 
                total: 25.00, 
                status: 'completed', 
                icon: 'fa-ticket', 
                color: 'text-red-500', 
                bg: 'bg-red-50 dark:bg-red-900/20',
                items: 'Garena Card $25'
            },
            { 
                id: 'ORD-8801', 
                date: '2023-11-10', 
                total: 15.00, 
                status: 'cancelled', 
                icon: 'fa-gamepad', 
                color: 'text-orange-500', 
                bg: 'bg-orange-50 dark:bg-orange-900/20',
                items: 'PUBG Mobile UC Pack'
            }
        ];

        // --- Render Logic ---
        function renderOrders(filter = 'all') {
            const container = document.getElementById('orders-list');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';

            const filtered = filter === 'all' ? orders : orders.filter(o => o.status === filter);

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filtered.forEach(order => {
                    const statusLabel = order.status.charAt(0).toUpperCase() + order.status.slice(1);
                    let statusClass = '';
                    if (order.status === 'completed') statusClass = 'status-completed';
                    if (order.status === 'processing') statusClass = 'status-processing';
                    if (order.status === 'cancelled') statusClass = 'status-cancelled';

                    const card = document.createElement('div');
                    card.className = 'bg-white dark:bg-[#0f172a] rounded-card shadow-soft p-4 border border-gray-100 dark:border-gray-800 animate-fade-in group active:scale-[0.99] transition-transform';
                    card.onclick = () => showToast(`View details for ${order.id}`);
                    
                    card.innerHTML = `
                        <div class="flex gap-4">
                            <!-- Icon -->
                            <div class="w-12 h-12 rounded-xl ${order.bg} ${order.color} flex items-center justify-center flex-shrink-0 text-xl shadow-sm">
                                <i class="fas ${order.icon}"></i>
                            </div>
                            
                            <!-- Content -->
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="font-bold text-sm truncate pr-2">${order.items}</h3>
                                    <span class="text-xs font-bold text-gray-900 dark:text-white">$${order.total.toFixed(2)}</span>
                                </div>
                                
                                <div class="flex justify-between items-center">
                                    <p class="text-[11px] text-gray-400 font-medium tracking-wide">${order.id} • ${order.date}</p>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider ${statusClass}">
                                        ${statusLabel}
                                    </span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Divider Line (Optional visual separator) -->
                        <div class="mt-3 pt-3 border-t border-gray-50 dark:border-gray-800/50 flex justify-end gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="text-xs font-medium text-gray-500 hover:text-gray-800 dark:hover:text-gray-200">View Invoice</button>
                            <button class="text-xs font-bold text-brand hover:text-red-700">Buy Again</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        // --- Filter Logic ---
        function filterOrders(filter) {
            // Update UI
            renderOrders(filter);
            
            // Update Tab Styles
            const tabs = ['all', 'processing', 'completed', 'cancelled'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === filter) {
                    btn.className = "px-4 py-2 text-xs font-bold rounded-full transition-all bg-brand text-white shadow-glow";
                } else {
                    btn.className = "px-4 py-2 text-xs font-bold rounded-full transition-all bg-white dark:bg-slate-800 text-gray-500 border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-slate-700";
                }
            });
        }

        // --- Toast Utility ---
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-slide-in pointer-events-auto min-w-[200px] shadow-soft z-50';
            toast.innerHTML = `<i class="fas fa-info-circle text-brand"></i><span class="font-medium text-sm">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('toast-slide-in');
                toast.classList.add('toast-slide-out');
                toast.addEventListener('animationend', () => toast.remove());
            }, 2500);
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            renderOrders('all');
            
            // Theme Check
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>
</body>
</html>
