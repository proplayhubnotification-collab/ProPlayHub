<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Support Center - ProPlay Hub</title>
    
    <!-- Meta Theme Color -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020618">

    <!-- Icons & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- Configuration -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['"Be Vietnam Pro"', 'sans-serif'],
                },
                colors: {
                    brand: '#ec003f',
                    slate: {
                        50: '#f8fafc',
                        950: '#020618',
                    },
                    robot: {
                        light: '#E2E8F0',
                        dark: '#334155',
                        accent: '#3B82F6'
                    }
                },
                borderRadius: {
                    DEFAULT: '0.375rem',
                    'card': '1rem',
                    'input': '0.5rem',
                    'chat': '1.25rem'
                },
                boxShadow: {
                    'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    'glow': '0 0 15px rgba(236, 0, 63, 0.3)',
                    'blue-glow': '0 0 15px rgba(59, 130, 246, 0.5)'
                },
                animation: {
                    'float': 'float 3s ease-in-out infinite',
                    'blink': 'blink 4s infinite',
                    'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                },
                keyframes: {
                    float: {
                        '0%, 100%': { transform: 'translateY(0)' },
                        '50%': { transform: 'translateY(-10px)' },
                    },
                    blink: {
                        '0%, 90%, 100%': { transform: 'scaleY(1)' },
                        '95%': { transform: 'scaleY(0.1)' },
                    }
                }
            }
        }
      }
    </script>

    <style>
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-slide-in { animation: slideIn 0.3s ease-out forwards; }
        
        /* CSS Robot Parts */
        .robot-eye {
            animation: blink 4s infinite;
        }
        .robot-antenna-glow {
            animation: pulse 2s infinite;
        }
        
        /* Chat Scrollbar */
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .dark .chat-scroll::-webkit-scrollbar-thumb { background-color: #475569; }

        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <main class="mx-auto w-full max-w-md bg-transparent relative z-0 flex flex-col h-screen">
        <!-- Toast Container -->
        <div id="toast-container" class="fixed top-4 right-4 z-[60] flex flex-col gap-2 pointer-events-none"></div>

        <!-- Header -->
        <header class="px-5 pt-12 pb-2 flex justify-between items-center sticky top-0 z-10 backdrop-blur-md bg-slate-50/90 dark:bg-slate-950/90 border-b border-gray-200/50 dark:border-gray-800/50 shrink-0">
            <button onclick="history.back()" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                <i class="fas fa-arrow-left text-lg"></i>
            </button>
            <div class="flex flex-col items-center">
                <h1 class="text-lg font-bold">ProBot Support</h1>
                <div class="flex items-center gap-1.5">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    <span class="text-[10px] text-green-600 dark:text-green-400 font-medium">Online</span>
                </div>
            </div>
            <div class="w-10 flex justify-end">
                <button onclick="toggleTheme()" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <i class="fas fa-ellipsis-vertical"></i>
                </button>
            </div>
        </header>

        <!-- Main Chat Area -->
        <div class="flex-1 overflow-y-auto px-4 py-6 space-y-6 chat-scroll" id="chat-container">
            
            <!-- Hero Robot Visualization -->
            <div class="flex justify-center py-4">
                <div class="relative w-32 h-32 animate-float">
                    <!-- Antenna -->
                    <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-1 h-6 bg-gray-400 dark:bg-gray-500"></div>
                    <div class="absolute -top-4 left-1/2 -translate-x-1/2 w-3 h-3 bg-red-500 rounded-full shadow-glow robot-antenna-glow"></div>
                    
                    <!-- Head -->
                    <div class="absolute inset-0 bg-white dark:bg-slate-800 rounded-3xl border-2 border-gray-200 dark:border-gray-700 shadow-soft flex flex-col items-center justify-center overflow-hidden">
                        <!-- Screen Face -->
                        <div class="w-24 h-16 bg-slate-900 rounded-xl flex items-center justify-center gap-4 relative overflow-hidden">
                            <!-- Reflection -->
                            <div class="absolute top-0 right-0 w-8 h-8 bg-white/10 rounded-full blur-md -mr-2 -mt-2"></div>
                            
                            <!-- Eyes -->
                            <div class="w-3 h-6 bg-blue-400 rounded-full shadow-blue-glow robot-eye"></div>
                            <div class="w-3 h-6 bg-blue-400 rounded-full shadow-blue-glow robot-eye"></div>
                        </div>
                        <!-- Mouth/Grill -->
                        <div class="mt-2 flex gap-1">
                            <div class="w-1 h-2 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
                            <div class="w-1 h-2 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
                            <div class="w-1 h-2 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
                        </div>
                    </div>

                    <!-- Ears/Headphones -->
                    <div class="absolute top-10 -left-2 w-4 h-8 bg-gray-300 dark:bg-gray-600 rounded-l-lg border-l border-gray-400"></div>
                    <div class="absolute top-10 -right-2 w-4 h-8 bg-gray-300 dark:bg-gray-600 rounded-r-lg border-r border-gray-400"></div>
                </div>
            </div>

            <!-- Bot Message (Welcome) -->
            <div class="flex gap-3">
                <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center shrink-0 border border-white dark:border-slate-600">
                    <i class="fas fa-robot text-xs text-slate-600 dark:text-slate-300"></i>
                </div>
                <div class="space-y-1 max-w-[80%]">
                    <div class="text-[10px] text-gray-400 ml-1">ProBot • 09:00</div>
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 dark:border-gray-800 text-sm text-gray-700 dark:text-gray-200">
                        Hi <span class="font-bold text-brand">Lê Gia Huy</span>! 👋 <br>
                        I'm ProBot, your personal assistant. How can I help you today?
                    </div>
                </div>
            </div>

            <!-- Quick Actions (Suggested Chips) -->
            <div class="flex flex-wrap gap-2 pl-11">
                <button onclick="sendQuickMessage('My order status?')" class="px-3 py-1.5 bg-brand/10 hover:bg-brand/20 text-brand text-xs font-medium rounded-full transition-colors border border-brand/20">
                    📦 Order status
                </button>
                <button onclick="sendQuickMessage('How to top-up?')" class="px-3 py-1.5 bg-blue-50 dark:bg-blue-900/20 hover:bg-blue-100 text-blue-600 dark:text-blue-400 text-xs font-medium rounded-full transition-colors border border-blue-200 dark:border-blue-800">
                    💎 Top-up Issue
                </button>
                <button onclick="sendQuickMessage('Referral program')" class="px-3 py-1.5 bg-yellow-50 dark:bg-yellow-900/20 hover:bg-yellow-100 text-yellow-600 dark:text-yellow-400 text-xs font-medium rounded-full transition-colors border border-yellow-200 dark:border-yellow-800">
                    🎁 Referral Info
                </button>
            </div>

        </div>

        <!-- Chat Input Area -->
        <div class="p-4 bg-white/80 dark:bg-[#0f172a]/90 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 shrink-0 pb-safe">
            <form id="chat-form" class="flex gap-2 items-end" onsubmit="event.preventDefault(); sendMessage();">
                <button type="button" class="w-10 h-10 rounded-full bg-gray-50 dark:bg-slate-800 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 flex items-center justify-center transition-colors shrink-0">
                    <i class="fas fa-plus"></i>
                </button>
                
                <div class="flex-1 relative">
                    <input type="text" id="message-input" class="w-full bg-gray-50 dark:bg-slate-800 border-none rounded-chat px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand/50 dark:text-white placeholder-gray-400" placeholder="Type a message..." autocomplete="off">
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-brand">
                        <i class="fas fa-face-smile"></i>
                    </button>
                </div>

                <button type="submit" id="send-btn" class="w-10 h-10 rounded-full bg-brand text-white flex items-center justify-center shadow-glow hover:bg-red-700 transition-colors shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-paper-plane text-sm translate-x-px translate-y-px"></i>
                </button>
            </form>
        </div>

    </main>

    <!-- Scripts -->
    <script>
        // --- Chat Logic ---
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // 1. Add User Message
            addUserMessage(text);
            messageInput.value = '';
            scrollToBottom();

            // 2. Simulate Bot Thinking & Response
            showTypingIndicator();
            
            setTimeout(() => {
                removeTypingIndicator();
                const response = getBotResponse(text);
                addBotMessage(response);
                scrollToBottom();
            }, 1500);
        }

        function sendQuickMessage(text) {
            addUserMessage(text);
            scrollToBottom();
            showTypingIndicator();
            setTimeout(() => {
                removeTypingIndicator();
                const response = getBotResponse(text);
                addBotMessage(response);
                scrollToBottom();
            }, 1000);
        }

        function addUserMessage(text) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const msgHTML = `
                <div class="flex flex-row-reverse gap-3 animate-fade-in">
                    <div class="space-y-1 max-w-[80%]">
                        <div class="text-[10px] text-gray-400 text-right mr-1">You • ${time}</div>
                        <div class="bg-brand p-3 rounded-2xl rounded-tr-none shadow-sm text-sm text-white">
                            ${text}
                        </div>
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', msgHTML);
        }

        function addBotMessage(text) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const msgHTML = `
                 <div class="flex gap-3 animate-fade-in">
                    <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center shrink-0 border border-white dark:border-slate-600">
                        <i class="fas fa-robot text-xs text-slate-600 dark:text-slate-300"></i>
                    </div>
                    <div class="space-y-1 max-w-[80%]">
                        <div class="text-[10px] text-gray-400 ml-1">ProBot • ${time}</div>
                        <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 dark:border-gray-800 text-sm text-gray-700 dark:text-gray-200">
                            ${text}
                        </div>
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', msgHTML);
        }

        function showTypingIndicator() {
            const html = `
                <div id="typing-indicator" class="flex gap-3 animate-fade-in">
                    <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center shrink-0 border border-white dark:border-slate-600">
                        <i class="fas fa-robot text-xs text-slate-600 dark:text-slate-300"></i>
                    </div>
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 dark:border-gray-800 flex items-center gap-1">
                        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></div>
                        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function getBotResponse(input) {
            input = input.toLowerCase();
            if (input.includes('order') || input.includes('status')) {
                return "You can check your order status in the <b>Order History</b> section. Most orders are processed instantly!";
            }
            if (input.includes('top-up') || input.includes('money')) {
                return "For top-up issues, please ensure your transaction ID is correct. If the issue persists, send us a screenshot here.";
            }
            if (input.includes('referral') || input.includes('invite')) {
                return "Invite friends using your code to earn 500 Points! Go to the <b>Referrals</b> page to get your code.";
            }
            return "I'm still learning! 🤖 But our human agents will review this chat shortly. Is there anything else?";
        }

        // --- Theme Init ---
        const toggleTheme = () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
        
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</body>
</html>
