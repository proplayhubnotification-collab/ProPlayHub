<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Edit Profile - ProPlay Hub</title>
    
    <!-- Meta Theme Color -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020618">

    <!-- Icons & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Configuration -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['"Be Vietnam Pro"', 'sans-serif'],
                },
                colors: {
                    brand: '#ec003f',
                    slate: {
                        50: '#f8fafc',
                        950: '#020618',
                    }
                },
                borderRadius: {
                    DEFAULT: '0.375rem',
                    'card': '1rem',
                    'input': '0.5rem'
                },
                boxShadow: {
                    'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    'glow': '0 0 15px rgba(236, 0, 63, 0.3)'
                }
            }
        }
      }
    </script>

    <style>
        /* Animations */
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .toast-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .toast-slide-out { animation: slideOut 0.3s ease-in forwards; }
        
        body { -webkit-tap-highlight-color: transparent; }
        
        /* Input Focus Ring */
        .input-field:focus {
            border-color: #ec003f;
            box-shadow: 0 0 0 3px rgba(236, 0, 63, 0.1);
            outline: none;
        }
        
        /* Hidden File Input */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <main class="mx-auto w-full max-w-md bg-transparent pb-8 relative z-0">
        <!-- Toast Container -->
        <div id="toast-container" class="fixed top-4 right-4 z-[60] flex flex-col gap-2 pointer-events-none"></div>

        <!-- Header -->
        <header class="px-5 pt-12 pb-4 flex justify-between items-center sticky top-0 z-10 backdrop-blur-md bg-slate-50/90 dark:bg-slate-950/90 border-b border-gray-200/50 dark:border-gray-800/50">
            <button onclick="history.back()" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                <i class="fas fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-lg font-bold">Edit Profile</h1>
            <div class="w-8"></div>
        </header>

        <!-- Main Content -->
        <div class="px-4 py-6 space-y-6">
            
            <!-- Avatar Upload Section -->
            <div class="flex flex-col items-center">
                <div class="relative w-28 h-28 group cursor-pointer">
                    <!-- Avatar Image -->
                    <div class="w-full h-full rounded-full overflow-hidden border-4 border-white dark:border-slate-800 shadow-glow relative z-0 bg-gray-200 dark:bg-slate-700">
                        <img id="avatar-preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix&backgroundColor=b6e3f4" alt="Avatar" class="w-full h-full object-cover transition-opacity duration-300">
                    </div>
                    
                    <!-- Edit Trigger -->
                    <label for="avatar-upload" class="absolute bottom-0 right-0 z-10 bg-brand text-white w-9 h-9 rounded-full flex items-center justify-center border-2 border-white dark:border-slate-900 shadow-md cursor-pointer hover:scale-110 transition-transform active:scale-95">
                        <i class="fas fa-camera text-xs"></i>
                    </label>
                    <input type="file" id="avatar-upload" accept="image/*" onchange="previewImage(event)">
                </div>
                <p class="text-xs text-gray-500 mt-3 dark:text-gray-400">Tap icon to change photo</p>
            </div>

            <!-- Form Fields -->
            <form id="profile-form" class="bg-white dark:bg-[#0f172a] rounded-card shadow-soft p-5 border border-gray-100 dark:border-gray-800 space-y-5" onsubmit="event.preventDefault(); saveProfile();">
                
                <!-- Section Label -->
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Public Info</h2>

                <!-- Name -->
                <div class="space-y-1.5">
                    <label for="input-name" class="text-sm font-medium text-gray-700 dark:text-gray-300">Display Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-user text-sm"></i>
                        </div>
                        <input type="text" id="input-name" value="Lê Gia Huy" 
                            class="input-field w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-gray-700 rounded-input text-gray-900 dark:text-white placeholder-gray-400 transition-all font-medium text-sm" 
                            placeholder="Your full name">
                    </div>
                </div>

                <!-- Username -->
                <div class="space-y-1.5">
                    <label for="input-username" class="text-sm font-medium text-gray-700 dark:text-gray-300">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-at text-sm"></i>
                        </div>
                        <input type="text" id="input-username" value="legiahuy99" 
                            class="input-field w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-gray-700 rounded-input text-gray-900 dark:text-white placeholder-gray-400 transition-all font-medium text-sm" 
                            placeholder="unique_username">
                    </div>
                </div>

                <!-- Bio -->
                <div class="space-y-1.5">
                    <label for="input-bio" class="text-sm font-medium text-gray-700 dark:text-gray-300">Bio</label>
                    <textarea id="input-bio" rows="3" 
                        class="input-field w-full p-3 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-gray-700 rounded-input text-gray-900 dark:text-white placeholder-gray-400 transition-all font-medium text-sm resize-none" 
                        placeholder="Tell us a little bit about yourself..."></textarea>
                </div>

                <!-- Divider -->
                <div class="h-px bg-gray-100 dark:bg-gray-800 my-2"></div>
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Private Info</h2>

                <!-- Email (Read Only) -->
                <div class="space-y-1.5 opacity-70">
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300 flex justify-between">
                        Email Address
                        <span class="text-[10px] bg-green-100 text-green-600 dark:bg-green-900/30 px-2 py-0.5 rounded-full font-bold uppercase">Verified</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-envelope text-sm"></i>
                        </div>
                        <input type="email" value="huy@example.com" readonly
                            class="w-full pl-10 pr-4 py-3 bg-gray-100 dark:bg-slate-800 border border-transparent rounded-input text-gray-500 dark:text-gray-400 font-medium text-sm cursor-not-allowed">
                    </div>
                </div>

                <!-- Phone -->
                <div class="space-y-1.5">
                    <label for="input-phone" class="text-sm font-medium text-gray-700 dark:text-gray-300">Phone Number</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-phone text-sm"></i>
                        </div>
                        <input type="tel" id="input-phone" value="0912 345 678" 
                            class="input-field w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-gray-700 rounded-input text-gray-900 dark:text-white placeholder-gray-400 transition-all font-medium text-sm" 
                            placeholder="+84...">
                    </div>
                </div>

                <!-- Gender & DOB Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Gender</label>
                        <div class="relative">
                            <select id="input-gender" class="input-field w-full pl-3 pr-8 py-3 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-gray-700 rounded-input text-gray-900 dark:text-white transition-all font-medium text-sm appearance-none">
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fas fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Birth Date</label>
                        <input type="date" id="input-dob" value="1999-01-01"
                            class="input-field w-full px-3 py-3 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-gray-700 rounded-input text-gray-900 dark:text-white transition-all font-medium text-sm">
                    </div>
                </div>

                <!-- Save Button -->
                <div class="pt-4">
                    <button type="submit" id="save-btn" class="w-full bg-brand hover:bg-red-700 text-white font-bold py-3.5 rounded-input shadow-lg shadow-red-500/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <span>Save Changes</span>
                        <i class="fas fa-check"></i>
                    </button>
                </div>
            </form>
            
            <div class="text-center pb-4">
                 <button onclick="history.back()" class="text-sm font-medium text-gray-500 hover:text-brand transition-colors">Cancel</button>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        // --- 1. Theme Logic (Auto Device) ---
        function applyTheme() {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        
        // Initial check
        applyTheme();

        // Listen for changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

        // --- 2. Toast Logic ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let icon = 'fa-info-circle';
            let color = 'text-brand';
            if(type === 'success') { icon = 'fa-check-circle'; color = 'text-green-500'; }
            
            toast.className = 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-slide-in pointer-events-auto min-w-[200px] shadow-soft z-50';
            toast.innerHTML = `<i class="fas ${icon} ${color}"></i><span class="font-medium text-sm">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('toast-slide-in');
                toast.classList.add('toast-slide-out');
                toast.addEventListener('animationend', () => toast.remove());
            }, 2500);
        }

        // --- 3. Avatar Preview Logic ---
        function previewImage(event) {
            const input = event.target;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatar-preview').src = e.target.result;
                    showToast('Photo selected. Save to apply.', 'info');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- 4. Save Logic ---
        function saveProfile() {
            // Get values
            const name = document.getElementById('input-name').value;
            const btn = document.getElementById('save-btn');
            
            // Loading State
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Saving...';
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            // Simulate API call
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                
                showToast('Profile updated successfully!', 'success');
                
                // Optional: Redirect back after delay
                // setTimeout(() => history.back(), 1500);
            }, 1200);
        }
    </script>
</body>
</html>
