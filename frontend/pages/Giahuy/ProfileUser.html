    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['"Be Vietnam Pro"', 'sans-serif'],
                    serif: ['"Cinzel"', 'serif'],
                },
                colors: {
                    brand: '#ec003f',
                    slate: {
                        50: '#f8fafc',
                        950: '#020618',
                    }

                borderRadius: {
                    DEFAULT: '0.375rem',
                    'card': '1rem' 
                },
                boxShadow: {
                    'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    'glow': '0 0 15px rgba(236, 0, 63, 0.3)',
                    'metallic': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.4)'
                }

    <style>
        /* Toast Animation */
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .toast-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .toast-slide-out { animation: slideOut 0.3s ease-in forwards; }

        /* METALLIC CARD STYLES */
        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .metallic-card {
            position: relative;
            overflow: hidden;
            background-size: 200% auto;
            transition: all 0.3s ease;
        }
        
        /* Shine Overlay */
        .metallic-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.4) 45%, rgba(255, 255, 255, 0.7) 50%, rgba(255, 255, 255, 0.4) 55%, transparent 60%);
            background-size: 200% 100%;
            animation: shine 5s infinite linear;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* Silver Gradient */
        .bg-tier-silver {
            background: linear-gradient(135deg, #9ca3af 0%, #d1d5db 25%, #f3f4f6 50%, #d1d5db 75%, #9ca3af 100%);
            color: #1f2937;
            border: 1px solid #e5e7eb;
        }

        /* Grain Texture */
        .texture-grain {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.3;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>

    <!-- JS Handling -->
    <script>
        // --- 1. Dark Mode Logic ---
        const toggleTheme = () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                updateMetaTheme('#f8fafc');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                updateMetaTheme('#020618');
            }
        }

        const updateMetaTheme = (color) => {
            const meta = document.querySelector('meta[name="theme-color"][media="(prefers-color-scheme: light)"]');
            if(meta) meta.setAttribute('content', color);
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // --- 2. Toast Notification Logic ---
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-slide-in pointer-events-auto min-w-[200px]';
            toast.innerHTML = `<i class="fas fa-info-circle text-brand"></i><span class="font-medium text-sm">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('toast-slide-in');
                toast.classList.add('toast-slide-out');
                toast.addEventListener('animationend', () => toast.remove());
            }, 3000);
        }
    </script>
    <script>
        // Data Model
        const userData = {
            name: 'Lê Gia Huy',
            tier: 'Silver',
            points: 170,
            nextTier: { name: 'Gold', requiredPoints: 500 },
            pointsExpiry: '2025-12-31'
        };

        const formatNumber = (n) => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        const formatDate = (isoDate) => {
            try { return new Date(isoDate).toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric' }); } catch (e) { return isoDate; }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const userName = document.getElementById('user-name');
            if (userName) userName.innerText = userData.name;

            const pointsAmount = document.getElementById('points-amount');
            const pointsInfoAmount = document.getElementById('points-info-amount');
            if (pointsAmount) pointsAmount.innerText = formatNumber(userData.points);
            if (pointsInfoAmount) pointsInfoAmount.innerText = formatNumber(userData.points);

            const pointsExpiry = document.getElementById('points-expiry');
            if (pointsExpiry) pointsExpiry.innerText = formatDate(userData.pointsExpiry);

            const pointsNextTier = document.getElementById('points-next-tier');
            if (pointsNextTier) pointsNextTier.innerText = userData.nextTier.name;

            const pointsNeeded = document.getElementById('points-needed');
            const needed = Math.max(0, userData.nextTier.requiredPoints - userData.points);
            if (pointsNeeded) pointsNeeded.innerText = formatNumber(needed);

            const progress = document.getElementById('points-progress');
            const percent = Math.min(100, Math.round((userData.points / userData.nextTier.requiredPoints) * 100));
            if (progress) {
                progress.style.width = percent + '%';
                progress.setAttribute('aria-valuenow', percent);
            }

            const tierName = document.getElementById('tier-name');
            if (tierName) tierName.innerText = userData.tier;
        });
    </script>
</body>
